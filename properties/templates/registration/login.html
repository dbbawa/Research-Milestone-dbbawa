{% extends "base.html" %}
{% block title %}Employee Login{% endblock %}
{% block auth %}
<div class="login-card">
  <div class="logo">ESTATE</div>
  <div class="sub">PROPERTY MANAGEMENT</div>
  <h2 style="text-align:center; margin: 0 0 4px;">Employee Login</h2>
  <p style="text-align:center; color:#666; font-size:14px; margin-top:0;">Sign in to access property management and operations.</p>

  {% if form.errors %}
    <div class="error">Invalid username or password.</div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <label for="id_username">Username</label>
    <input type="text" name="username" id="id_username" autofocus required>
    <label for="id_password">Password</label>
    <input type="password" name="password" id="id_password" required>
    <button class="btn" type="submit">Sign in to portal →</button>
  </form>
</div>
{% endblock %}
