<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Estate Property Management{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #DFA255;
      --burgundy: #7A2331;
      --slate: #9FC1CB;
      --navy: #1C2430;
      --bg: #EEF1FA;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Work Sans', sans-serif; background: var(--bg); color: var(--navy); }
    h1, h2, h3, .label { font-family: 'Space Grotesk', sans-serif; }

    .shell { display: flex; min-height: 100vh; }
    .sidebar { width: 220px; background: var(--navy); color: #fff; padding: 24px 16px; }
    .sidebar .logo { font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: 3px; font-size: 20px; margin-bottom: 32px; }
    .sidebar .nav-label { font-size: 11px; letter-spacing: 1.5px; color: #8b94a5; margin-bottom: 8px; }
    .sidebar a { display: block; padding: 10px 12px; color: #fff; text-decoration: none; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
    .sidebar a.active { background: var(--burgundy); }

    main { flex: 1; }
    .topbar { background: #fff; padding: 14px 32px; display: flex; justify-content: flex-end; align-items: center; gap: 16px; }
    .topbar .who { text-align: right; font-size: 13px; }
    .topbar .who small { display: block; color: #777; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
    .content { padding: 32px; }

    .btn { background: var(--burgundy); color: #fff; border: 0; padding: 12px 20px; font-family: 'Space Grotesk', sans-serif;
           text-transform: uppercase; letter-spacing: 1px; font-size: 13px; cursor: pointer; border-radius: 4px; }
    .btn.small { padding: 8px 14px; font-size: 12px; }

    .stats { display: flex; gap: 16px; margin: 24px 0; flex-wrap: wrap; }
    .stat { background: #fff; padding: 20px 24px; border-left: 4px solid var(--gold); min-width: 200px; }
    .stat .label { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: #777; }
    .stat .value { font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .card { background: #fff; border-radius: 6px; overflow: hidden; }
    .card .banner { background: var(--navy); color: var(--gold); height: 110px; display: flex; align-items: center;
                    justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 40px; font-weight: 700; }
    .card .body { padding: 16px; }
    .card h3 { margin: 0 0 4px; }
    .card .addr { color: #666; font-size: 14px; margin-bottom: 12px; }
    .card .meta { border-top: 1px solid #e3e6ee; padding-top: 10px; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--burgundy); }

    .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { background: #fff; width: 100%; max-width: 420px; padding: 36px; border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    .login-card .logo { text-align: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: 4px; font-size: 24px; color: var(--burgundy); }
    .login-card .sub { text-align: center; font-size: 11px; letter-spacing: 3px; color: #888; margin-bottom: 24px; }
    .login-card label { display: block; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; margin: 16px 0 6px; font-weight: 600; }
    .login-card input { width: 100%; padding: 12px; border: 1px solid #ccd2de; border-radius: 4px; font-size: 15px; }
    .login-card .btn { width: 100%; margin-top: 24px; }
    .error { background: #fbe9ec; color: var(--burgundy); padding: 10px 12px; border-radius: 4px; font-size: 14px; margin-bottom: 8px; }
    .empty { background: #fff; padding: 24px; border-radius: 6px; }
  </style>
</head>
<body>
{% if user.is_authenticated %}
  <div class="shell">
    <aside class="sidebar">
      <div class="logo">ESTATE</div>
      <div class="nav-label">NAVIGATION</div>
      <a href="{% url 'property_list' %}" class="active">Dashboard</a>
    </aside>
    <main>
      <header class="topbar">
        <div class="who">{{ user.username }}<small>Employee</small></div>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button class="btn small" type="submit">Log out</button>
        </form>
      </header>
      <section class="content">
        {% block content %}{% endblock %}
      </section>
    </main>
  </div>
{% else %}
  <div class="center">
    {% block auth %}{% endblock %}
  </div>
{% endif %}
</body>
</html>
